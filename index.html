document.getElementById("rat").innerHTML=`<div class="prose"><h3>Rationale (259 words)</h3><p><b>Direction.</b> The site behaves like a drawing set. A visible 12-column grid, hairline rules, dimension lines, level markers and mono title-block labels deliver the architectural feel without stock photography. Layout is Swiss-influenced: oversized extended caps, rigid columns, large tabular figures. Yellow is reserved for a full stop, marker, square or focus ring, about 5% of any screen.</p><p><b>Motion with purpose.</b> The optional intro plays once: a six-level elevation is sketched, drawn and dimensioned, an RL counter climbs to 18.40, then the marker travels across and becomes the dot in CLIENT CO. Elsewhere motion is limited to line-draw on scroll, headline reveals, count-ups and row hover. Reduced-motion users see the finished state.</p><p><b>Home.</b> Positioning and proof first, then a sector tour (pick a sector, see a project, open full details), the method, six capabilities, featured case study, credentials and insights.</p><p><b>Projects.</b> A register, not a gallery: large tabular values, a plan icon per sector, sector filter and year or value sort. Long names wrap, and missing images fall back to a generated drawing.</p><p><b>Detail.</b> A section drawing builds level by level above key data, then Challenge, Approach and Outcome with oversized numerals, an image slider that fits one viewport, and the next project.</p><p><b>Accessibility and system.</b> Every text and background pairing is checked against WCAG 2.1 AA, with ratios on the style tile. Targets are 44px or larger, focus is visible, and components repeat across pages and cope with uneven CMS content.</p><h3>With more time</h3><p>Real drawings and photography per project, the remaining pages, and a 40-project content test.</p><p class="mono" style="font-size:12px;margin-top:20px">Started 7:15 PM Sun 11 Oct · Hours spent: approx. 7 (discovery to IA 3h, art direction and wireframes 1h, interactive HTML 1–2h, Figma build 1–2h) · Availability: [add] · Figma: https://www.figma.com/design/mtpP1pwloFaJ35m9O1gBGN/Client.Co</p></div>`;

let ts=0,tpj=0,tSeen=false;const tour=document.getElementById("tour"),tl=document.getElementById("tl"),tpn=document.getElementById("tp");
